name: Refresh podcast feeds

# Rebuilds the 6 Apple-ready RSS feeds from the muse.ai source feeds every
# morning, so new episodes appear automatically. build-feeds.py is committed
# in this repo (it used to be embedded as a heredoc, which silently never ran
# because the indented terminator didn't close the heredoc). The XML files are
# committed back to this repo, and GitHub Pages serves them at:
#   https://<username>.github.io/kl-farm-podcasts/<show-slug>.xml

on:
  schedule:
    - cron: "15 11 * * *"   # ~7:15 AM Eastern, after the daily episodes publish
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feeds
        run: python3 build-feeds.py

      - name: Commit updated feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add '*.xml'
          git diff --cached --quiet || git commit -m "Refresh podcast feeds"
          git push
