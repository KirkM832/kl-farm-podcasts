name: Upload episodes to Internet Archive

# Moves new episode MP3s to permanent archive.org hosting and records the
# stable download URLs in enclosure-overrides.json. The feeds.yml workflow
# then rewrites each feed item's enclosure URL via build-feeds.py, so Apple
# Podcasts always sees enclosures that never expire.
#
# Schedule: runs at 3:30 AM Eastern (winter) / 4:30 AM Eastern (summer) --
# GitHub cron is UTC, so the local time shifts an hour at the DST change.
# The dead-of-night slot is deliberate: the feeds workflow and the morning
# episode publishes are quiet then, so this run's final commit has nobody
# to race. It banks the previous day's episodes.
#
# Fix (Nov 15, 2026): the commit step now re-syncs and retries when its push
# is rejected. The feeds workflow often commits while this run is uploading,
# which used to make the final push fail and marked the whole run "failed"
# even though the episodes uploaded fine. The concurrency block also keeps
# two upload runs from overlapping.

on:
  schedule:
    - cron: "30 8 * * *"   # 3:30 AM EST / 4:30 AM EDT daily
  workflow_dispatch:

concurrency:
  group: ia-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload new episodes to the Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python3 ia_upload.py

      - name: Commit updated overrides
        # always(): commit whatever progress the upload step made, even when
        # it exits 1 over a failed episode. Without this, one bad episode
        # discards every successful upload's override and the same backlog
        # (plus new episodes) is retried from scratch the next day.
        if: always()
        run: |
          git config user.name "kl-farm-bot"
          git config user.email "kl-farm-bot@users.noreply.github.com"
          git add enclosure-overrides.json
          if git diff --cached --quiet; then
            echo "No override changes to commit."
            exit 0
          fi
          git commit -m "Update IA enclosure overrides"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 5) - the feeds workflow likely committed during the upload. Re-syncing and retrying..."
            git pull --rebase origin main
            sleep 5
          done
          echo "Push still failing after 5 attempts."
          exit 1
